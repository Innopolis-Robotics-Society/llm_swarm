"/**":
  ros__parameters:
    # Shared LLM backend/model settings for LLM-capable nodes.
    # Launch files override these via a single public llm_endpoint argument.
    # Never store a real API key here; set the environment variable named by
    # llm_api_key_env instead.

    llm_mode: "ollama"
    llm_endpoint: "http://localhost:11434/api/chat" # Ollama default
    llm_model: "mistral-small3.1"

    # llm_mode: "http"
    # llm_endpoint: "https://api.groq.com/openai/v1/chat/completions"
    # llm_model: "llama-3.3-70b-versatile"
    llm_api_key: ""
    llm_api_key_env: "LLM_API_KEY"
    llm_force_chat: true
    llm_enable_stop: false
    llm_temperature: 0.1
    # Local Ollama input context window. Channel-3 sends a large system prompt,
    # map context, few-shot JSON examples, tool schemas, and sometimes runtime
    # state; ~8k is too tight for Qwen32B-style planning turns. For HTTP/vLLM
    # endpoints this ROS parameter is only a hint/log value: configure the
    # server-side model context/max_model_len separately.
    llm_num_ctx: 32768

llm_decision_server:
  ros__parameters:
    # Channel 1 — BT/MAPF WARN/INFO -> wait / abort / replan.
    llm_max_tokens: 2048
    dataset_path: "~/.ros/llm_decisions"
    max_concurrent: 1
    timeout_sec: 45.0
    default_on_error: "wait"
    log_tail: 20

llm_passive_observer:
  ros__parameters:
    # Channel 2 — passive observer. Disabled by default.
    llm_max_tokens: 2048
    history_size: 20
    cooldown_sec: 10.0
    timeout_sec: 45.0
    dataset_path: "~/.ros/llm_commands"
    enabled: false

llm_chat_server:
  ros__parameters:
    # Channel 3 — RViz operator chat -> reply + JSON plan.
    # Keep output budget bounded so it does not consume the whole context
    # window. Plans should fit comfortably under 3k generated tokens.
    llm_max_tokens: 3072
    # Ceiling for the whole conversation, enforced per tool-loop iteration by
    # _prepare_llm_context_budget. It is NOT the model's context window: the
    # guard aborts the turn with RuntimeError once
    #   input_est > window - margin - min_completion
    # and every tool iteration adds the tool result plus the assistant reply.
    #
    # At the old 16384 the E3 prompt (~9.6k tokens) plus TOOL_DEFINITIONS
    # (~1.5k) started at ~11k, leaving room for three iterations before the
    # abort — so tool_max_iterations: 20 was unreachable and missions died
    # mid-turn on a message about context, not about the mission. 65536 fits
    # twenty iterations at ~2k each with room to spare, while still bounding a
    # runaway loop; the hosted 397b itself offers 262144. See E3_spec.md §4.3.
    llm_context_window_tokens: 65536
    llm_context_margin_tokens: 512
    llm_default_max_completion_tokens: 2048
    llm_min_completion_tokens: 512
    # One hosted call with a ~10k prompt measured 13 s for a short answer; a
    # full 2048-token plan over the network lands closer to 40-50 s, so 60 s
    # was inside the noise band. Local Ollama is unaffected — this is an upper
    # bound, not a delay.
    timeout_sec: 120.0
    # Per-step cap. A single E3 leg can be a 45 m corridor drive, which is
    # ~90 s at desired_linear_vel 0.5 m/s before planning and dispatch, so 120 s
    # cut legs off mid-drive rather than on failure. See paper/E3_spec.md §4.3.
    step_timeout_sec: 300.0

    # Remediation: on plan-execution failure, re-prompt the LLM with the
    # failure info and a fresh (targeted) MCP snapshot up to N times. Set
    # max_remediation_attempts=0 or remediation_enabled=false to keep the
    # legacy "fail fast" behaviour.
    remediation_enabled: true
    max_remediation_attempts: 2
    # Post-execution verification repair: after a plan reports execution
    # success, read formation/pose state and ask the LLM for bounded repair if
    # the requested outcome does not actually hold.
    llm_repair_enabled: true
    llm_max_repair_attempts: 2
    llm_repair_require_verification: true
    llm_verification_delay_sec: 0.2
    # Mission supervision: bounded execute -> verify -> continuation loop.
    # This wraps the existing PlanExecutor, ToolExecutor, and verification
    # repair prompt; it does not add new control tools.
    llm_mission_supervision_enabled: true
    # Wall clock for the whole mission loop. At 180 s an E3 mission finished at
    # 174.5 s, i.e. it was bounded by the timer rather than by the system, which
    # would have made the supervision ablation a measurement of this number.
    # 600 s leaves the mission budget as the outermost bound, above every
    # per-step and per-loop cap below it.
    #
    # 600 turned out to be the same mistake one mission up. All three recorded
    # M3 runs ended with carry_shields_to_reactor still `carrying` -- a ~65 m
    # haul that starts only after the last point task finishes at 425-496 s.
    # The other eight tasks were done; the ninth had no time left. So an M3 cell
    # at 600 s measures this number, exactly as the 180 s cell measured the old
    # one. 900 clears the observed makespan by ~400 s while staying above every
    # cap below it (step_timeout_sec 300 -- a 65 m leg at 0.5 m/s is ~130 s).
    llm_mission_max_duration_sec: 900.0
    llm_mission_max_steps: 6
    llm_mission_verify_delay_sec: 0.8
    llm_mission_min_progress_required: true
    llm_mission_allow_repair: true
    llm_mission_no_progress_limit: 2

    # Read-only runtime context for /llm/chat.
    # MCP read-only context disabled — uvx ros-mcp fails with BrokenResourceError.
    # Re-enable with context_provider: "mcp_readonly" once fixed.
    context_provider: "none"
    context_timeout_sec: 2.0
    context_max_chars: 6000
    context_include_bt_state: true
    context_include_formations: true
    context_include_map_summary: true
    context_include_recent_events: true
    # Live robot poses sourced from /robot_*/odom via a local subscriber
    # cache. The LLM uses these to compute formation goals as
    # leader_xy + offsets instead of inventing absolute coordinates.
    context_include_robot_positions: true
    context_pose_stale_ms: 2000

    # Server-side safety net: when the LLM emits a bare formation leaf
    # without prepending a staging mapf, PlanExecutor reads live poses,
    # computes leader_xy + offsets, and auto-injects the staging step for
    # any follower further than this from its target. Must match
    # formation_manager_node's position_tolerance (default 0.5 m).
    formation_tolerance_m: 0.5

    # Tool calling loop for get_robot_position / get_positions / check_occupancy.
    # Off: with a context window that fits the prompt the model plans directly.
    # NOTE: mutually exclusive with structured_output_enabled — schema-constrained
    # decoding suppresses tool_calls — so keep this off when structured outputs
    # are on. Flip on (and structured_output_enabled off) for tool experiments.
    tool_calling_enabled: true
    # Exhausting this raises "tool loop exceeded N iterations without producing
    # a final text response" — the whole turn fails, so a mission dies on the
    # loop cap rather than on anything about the mission. Observed at 6 on a
    # supervision continuation step. The mission budget above is the real bound.
    tool_max_iterations: 20
    robot_footprint_radius: 0.22
    scan_timeout_sec: 3.0
    # Structured outputs: send the plan JSON schema to the backend so the model
    # can only emit schema-valid JSON (kills the malformed-JSON failure mode).
    # Applies to the plain (non-tool) path.
    structured_output_enabled: true
    # Auto-spread near-coincident mapf goals into a cluster. Off: the LLM emits
    # one goal per robot and the motion planner resolves collisions.
    goal_spread_enabled: false
    # Stream reasoning tokens to the panel as stage='thinking' feedback.
    stream_reasoning: true

    # MCP read-only provider. The full demo starts rosbridge by default.
    # The provider logs actionable diagnostics if uvx, ros-mcp, the MCP SDK,
    # rosbridge, or tool calls are unavailable.
    mcp_enabled: true
    mcp_transport: "stdio"
    mcp_command: "uvx"
    mcp_args:
      - "ros-mcp"
      - "--transport=stdio"
    mcp_tool_allowlist:
      - "get_topics"
      - "get_topic_type"
      - "get_topic_details"
      - "subscribe_once"
      - "get_nodes"
      - "get_node_details"
      - "get_services"
      - "get_service_type"
      - "get_service_details"
      - "get_actions"
      - "get_action_details"
      # - "get_action_status"

user_chat:
  ros__parameters:
    # Terminal channel-3 client (user_chat_node.py).
    stream_reasoning: true
    # Kept equal to llm_chat_server: the CLI mirror must not fail a mission the
    # panel would have completed.
    tool_max_iterations: 20
    robot_footprint_radius: 0.22
    scan_timeout_sec: 3.0

llm_execute_server:
  ros__parameters:
    # Operator-confirmed plan replay. No LLM call here.
    step_timeout_sec: 300.0
    # Must match llm_chat_server so a previewed plan executes identically.
    goal_spread_enabled: false
